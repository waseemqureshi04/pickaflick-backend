---
- name: Deploy Pickaflick Backend with Podman & Caddy
  hosts: webserver
  become: true
  vars:
    repo_url: "https://github.com/waseemqureshi04/pickaflick-backend.git"
    app_dir: "/var/www/pickaflick"

  tasks:
    # 1. STOP TIMERS: Prevent background updates
    - name: Disable apt systemd timers
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      with_items:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      ignore_errors: yes

    # 2. KILL & CLEAN: Kill processes AND remove the broken Caddy repo file
    - name: Kill apt, remove corrupt lists and old Caddy repo
      shell: |
        pkill -x apt || true
        pkill -x apt-get || true
        # Remove corrupted list cache
        rm -rf /var/lib/apt/lists/*
        # Remove the specific Caddy file causing the GPG error
        rm -f /etc/apt/sources.list.d/caddy-stable.list
        
        rm -f /var/lib/dpkg/lock-frontend
        rm -f /var/lib/dpkg/lock
        rm -f /var/cache/apt/archives/lock
        dpkg --configure -a
      ignore_errors: yes

    # 3. UPDATE CACHE: Now safe because the bad Caddy repo is gone
    - name: Update apt cache
      apt:
        update_cache: yes
        force_apt_get: yes
      register: apt_action
      retries: 5
      delay: 5
      until: apt_action is success

    # 4. INSTALL DEPENDENCIES
    - name: Install dependencies
      apt:
        name:
          - git
          - podman
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
        state: present
        force_apt_get: yes
      environment:
        DEBIAN_FRONTEND: noninteractive

    # 5. RE-ADD CADDY: Download the NEW valid key and re-install
    - name: Install Caddy (Web Server)
      shell: |
        # Download new key
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        # Re-add the repo list
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
        # Update just for Caddy and install
        apt-get update
        apt-get install caddy -y
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Clone or Pull the latest code
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes

    - name: Build the Podman Image
      command: podman build -t pickaflick-backend .
      args:
        chdir: "{{ app_dir }}"

    - name: Stop and remove old container (if running)
      command: podman rm -f pickaflick_container
      ignore_errors: yes

    - name: Run the new container
      command: >
        podman run -d 
        --name pickaflick_container 
        -p 3002:3002 
        -e TMDB_KEY='{{ tmdb_key }}' 
        -e OPENAI_KEY='{{ openai_key }}' 
        pickaflick-backend

    - name: Configure Caddy for HTTPS
      copy:
        dest: /etc/caddy/Caddyfile
        content: |
          api.pickaflick.live {
              reverse_proxy localhost:3002
          }
      notify: Restart Caddy

  handlers:
    - name: Restart Caddy
      service:
        name: caddy
        state: restarted