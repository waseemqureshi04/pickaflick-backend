---
- name: Deploy Pickaflick Backend with Podman & Caddy
  hosts: webserver
  become: true
  vars:
    repo_url: "https://github.com/waseemqureshi04/pickaflick-backend.git"
    app_dir: "/var/www/pickaflick"

  tasks:
    # 1. STOP SERVICE: Gracefully stop the background updater so we can take over
    - name: Stop unattended-upgrades service
      service:
        name: unattended-upgrades
        state: stopped
      ignore_errors: yes

    # 2. KILL PROCESSES: Use -x (Exact Match) to avoid killing Ansible itself
    - name: Kill stale apt processes safely
      shell: |
        pkill -x apt || true
        pkill -x apt-get || true
        pkill -x dpkg || true
      ignore_errors: yes

    # 3. REMOVE LOCKS: Manually delete the lock files blocking the install
    - name: Remove lock files
      shell: |
        rm -f /var/lib/dpkg/lock-frontend
        rm -f /var/lib/dpkg/lock
        rm -f /var/lib/apt/lists/lock
        rm -f /var/cache/apt/archives/lock
        dpkg --configure -a
      ignore_errors: yes

    # 4. UPDATE: Now safe to update (Non-Interactive Mode)
    - name: Update apt cache and upgrade system
      apt:
        update_cache: yes
        upgrade: dist
        force_apt_get: yes
        dpkg_options: 'force-confold,force-confdef'
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: apt_action
      retries: 10
      delay: 10
      until: apt_action is success

    # 5. INSTALL DEPENDENCIES
    - name: Install dependencies
      apt:
        name:
          - git
          - podman
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
        state: present
        force_apt_get: yes
      environment:
        DEBIAN_FRONTEND: noninteractive

    # 6. INSTALL CADDY
    - name: Install Caddy (Web Server)
      shell: |
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
        apt-get update
        apt-get install caddy -y
      args:
        creates: /usr/bin/caddy
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Clone or Pull the latest code
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes

    - name: Build the Podman Image
      command: podman build -t pickaflick-backend .
      args:
        chdir: "{{ app_dir }}"

    - name: Stop and remove old container (if running)
      command: podman rm -f pickaflick_container
      ignore_errors: yes

    - name: Run the new container
      command: >
        podman run -d 
        --name pickaflick_container 
        -p 3002:3002 
        -e TMDB_KEY='{{ tmdb_key }}' 
        -e OPENAI_KEY='{{ openai_key }}' 
        pickaflick-backend

    - name: Configure Caddy for HTTPS
      copy:
        dest: /etc/caddy/Caddyfile
        content: |
          api.pickaflick.live {
              reverse_proxy localhost:3002
          }
      notify: Restart Caddy

  handlers:
    - name: Restart Caddy
      service:
        name: caddy
        state: restarted