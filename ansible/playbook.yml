---
- name: Deploy Pickaflick Backend with Podman & Caddy
  hosts: webserver
  become: true
  vars:
    repo_url: "https://github.com/waseemqureshi04/pickaflick-backend.git"
    app_dir: "/var/www/pickaflick"

  tasks:
    # 1. ROBUST UPDATE: Update cache safely without killing processes
    # We use 'retry' to patiently wait if the system is busy (unattended-upgrades)
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600 # If cache is <1 hour old, skip update (speeds up deploy)
        force_apt_get: yes
      register: apt_action
      retries: 20
      delay: 30
      until: apt_action is success

    # 2. INSTALL DEPENDENCIES
    - name: Install dependencies
      apt:
        name:
          - git
          - podman
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
        state: present
        force_apt_get: yes
      environment:
        DEBIAN_FRONTEND: noninteractive

    # 3. INSTALL/UPDATE CADDY
    # We keep the key steps to ensure it stays valid, but removed the "rm" command
    - name: Ensure Caddy is installed and updated
      shell: |
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
        apt-get update
        apt-get install caddy -y
      args:
        creates: /usr/bin/caddy # Skip if Caddy is already installed
      environment:
        DEBIAN_FRONTEND: noninteractive

    # 4. APP DEPLOYMENT (Standard Steps)
    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Clone or Pull the latest code
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes

    - name: Build the Podman Image
      command: podman build -t pickaflick-backend .
      args:
        chdir: "{{ app_dir }}"

    - name: Stop and remove old container (if running)
      command: podman rm -f pickaflick_container
      ignore_errors: yes

    - name: Run the new container
      # UPDATED: Added LOCAL_CLIENT_URL to allow localhost access
      command: >
        podman run -d 
        --name pickaflick_container 
        -p 3002:3002 
        -e TMDB_KEY='{{ tmdb_key }}' 
        -e OPENAI_KEY='{{ openai_key }}' 
        -e LOCAL_CLIENT_URL='http://localhost:3000'
        pickaflick-backend

    - name: Configure Caddy for HTTPS
      copy:
        dest: /etc/caddy/Caddyfile
        content: |
          api.pickaflick.live {
              reverse_proxy localhost:3002
          }
      notify: Restart Caddy

  handlers:
    - name: Restart Caddy
      service:
        name: caddy
        state: restarted